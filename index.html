<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2a2e" />
    <meta
      name="description"
      content="Monthly budgeting app for tracking expenses, setting category limits, and managing cash flow."
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <title>Monthly Budget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Monthly Statement</p>
          <h1>Budget Planner</h1>
        </div>
        <button id="resetDataBtn" class="ghost-button" type="button">Clear expenses</button>
      </header>

      <main class="content">
        <section class="hero card">
          <div id="statusStamp" class="stamp" aria-hidden="true">
            <span>On track</span>
          </div>

          <div class="hero-header">
            <div>
              <p class="label">Monthly income</p>
              <div class="income-row">
                <span class="currency">$</span>
                <input id="monthlyIncomeInput" type="number" min="0" step="0.01" value="3500" aria-label="Monthly income" />
              </div>
            </div>
            <button id="saveIncomeBtn" class="primary-button" type="button">Save income</button>
          </div>

          <div class="summary-grid">
            <article class="summary-cell">
              <span>Budgeted</span>
              <strong id="budgetedValue">$0.00</strong>
            </article>
            <article class="summary-cell">
              <span>Spent</span>
              <strong id="spentValue">$0.00</strong>
            </article>
            <article class="summary-cell">
              <span>Left</span>
              <strong id="leftValue">$0.00</strong>
            </article>
          </div>
        </section>

        <section class="panel card panel-form">
          <div class="panel-header">
            <p class="eyebrow">Ledger entry</p>
            <h2>Quick add expense</h2>
          </div>

          <form id="expenseForm" class="expense-form">
            <div class="field-group">
              <label for="categorySelect">Category</label>
              <select id="categorySelect"></select>
            </div>

            <div class="field-group">
              <label for="expenseNameInput">Description</label>
              <input id="expenseNameInput" type="text" placeholder="Groceries" required />
            </div>

            <div class="field-row">
              <div class="field-group">
                <label for="expenseAmountInput">Amount</label>
                <input id="expenseAmountInput" type="number" min="0" step="0.01" placeholder="0.00" required />
              </div>

              <div class="field-group">
                <label for="expenseDateInput">Date</label>
                <input id="expenseDateInput" type="date" required />
              </div>
            </div>

            <button class="primary-button full-width" type="submit">Add expense</button>
          </form>
        </section>

        <section class="panel card panel-ledger">
          <div class="panel-header">
            <p class="eyebrow">Envelopes</p>
            <h2>Category ledger</h2>
          </div>
          <div class="ledger-head" aria-hidden="true">
            <span>Category</span>
            <span>Progress</span>
            <span>Budget</span>
          </div>
          <div id="categoryList" class="category-list"></div>
        </section>

        <section class="panel card panel-register">
          <div class="panel-header">
            <p class="eyebrow">Register</p>
            <h2>Recent spending</h2>
          </div>
          <ul id="expenseList" class="expense-list"></ul>
        </section>
      </main>
    </div>

    <script>
      window.BUDGET_SUPABASE_CONFIG = {
        url: "https://ysuxikqnmkyqzcqvrnol.supabase.co",
        anonKey: "sb_publishable_WQtqqyodV_rClW34QtrvwA_sb4UXUVh"
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
  </body>
</html>
